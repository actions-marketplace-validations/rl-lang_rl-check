name: 'RL Check'
description: 'Run rl check on your repository using the RL language'
author: 'MohamedGonem'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  version:
    description: 'RL version: latest, nightly, or vX.Y.Z (e.g. v2.3.0). Defaults to the latest stable release.'
    required: false
    default: 'latest'
  file:
    description: 'File to check (e.g., main.rl). Ignored if folder is set.'
    required: false
    default: ''
  folder:
    description: 'Folder to check (e.g., nano/, cd/). Runs rl check on every .rl file directly inside it.'
    required: false
    default: ''
  args:
    description: 'Additional arguments to pass to rl check'
    required: false
    default: ''
  working-directory:
    description: 'Working directory to run rl check in'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup RL
      uses: rl-lang/rl-setup@main
      with:
        version: ${{ inputs.version }}
        binaries: rl

    - name: Run rl check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        FOLDER="${{ inputs.folder }}"
        FILE="${{ inputs.file }}"

        if [ -n "$FOLDER" ]; then
          if [ ! -d "$FOLDER" ]; then
            echo "::error::Folder not found: $FOLDER"
            exit 1
          fi

          echo "Checking all .rl files in $FOLDER"
          cd "$FOLDER"

          FAIL=0
          COUNT=0
          for f in *.rl; do
            [ -e "$f" ] || continue
            COUNT=$((COUNT+1))
            echo "::group::rl check $f"
            if rl check "$f" ${{ inputs.args }}; then
              echo "PASS $f"
            else
              echo "::error::rl check failed for $f"
              FAIL=1
            fi
            echo "::endgroup::"
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No .rl files found in $FOLDER"
            exit 1
          fi

          exit $FAIL
        elif [ -n "$FILE" ]; then
          echo "Running: rl check $FILE ${{ inputs.args }}"
          rl check "$FILE" ${{ inputs.args }}
        else
          echo "::error::Must set either 'file' or 'folder'"
          exit 1
        fi
