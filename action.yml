name: 'RL Check'
description: 'Run rl check on your repository using the RL language'
author: 'MohamedGonem'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  version:
    description: 'rl-cli version to install from crates.io (e.g. 0.1.4). Defaults to the latest published version.'
    required: false
    default: ''
  file:
    description: 'File to check (e.g., main.rl). Ignored if folder is set.'
    required: false
    default: ''
  folder:
    description: 'Folder to check (e.g., nano/, cd/). Runs rl check on every .rl file directly inside it.'
    required: false
    default: ''
  args:
    description: 'Additional arguments to pass to rl check'
    required: false
    default: ''
  working-directory:
    description: 'Working directory to run rl check in'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache rl-cli install
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin
        key: rl-cli-${{ runner.os }}-${{ inputs.version || 'latest' }}

    - name: Install rl-cli
      shell: bash
      run: |
        if command -v rl >/dev/null 2>&1; then
          echo "Using cached rl-cli: $(rl --version)"
        elif [ -n "${{ inputs.version }}" ]; then
          cargo install rl-cli --version "${{ inputs.version }}" --locked
        else
          cargo install rl-cli --locked
        fi

    - name: Verify RL install
      shell: bash
      run: rl --version

    - name: Run rl check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        FOLDER="${{ inputs.folder }}"
        FILE="${{ inputs.file }}"

        if [ -n "$FOLDER" ]; then
          if [ ! -d "$FOLDER" ]; then
            echo "::error::Folder not found: $FOLDER"
            exit 1
          fi

          echo "Checking all .rl files in $FOLDER"
          cd "$FOLDER"

          FAIL=0
          COUNT=0
          for f in *.rl; do
            [ -e "$f" ] || continue
            COUNT=$((COUNT+1))
            echo "::group::rl check $f"
            if rl check "$f" ${{ inputs.args }}; then
              echo "✅ $f"
            else
              echo "::error::rl check failed for $f"
              FAIL=1
            fi
            echo "::endgroup::"
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No .rl files found in $FOLDER"
            exit 1
          fi

          exit $FAIL
        elif [ -n "$FILE" ]; then
          echo "Running: rl check $FILE ${{ inputs.args }}"
          rl check "$FILE" ${{ inputs.args }}
        else
          echo "::error::Must set either 'file' or 'folder'"
          exit 1
        fi
